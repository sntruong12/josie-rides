{{define "emoji-box"}}
<div class="emoji-box">
    <div class="emoji-box-header">
        <h3>World Wide Web Reactions</h3>
    </div>

    <div class="emoji-stage" id="emoji-stage" aria-label="Emoji reactions screensaver">
        <!-- Dummy hardcoded emojis for development and testing -->
        <span class="dvd-emoji" role="img" aria-label="Bicycle">🚴</span>
        <span class="dvd-emoji" role="img" aria-label="Fire">🔥</span>
        <span class="dvd-emoji" role="img" aria-label="Jellyfish">🪼</span>
        <span class="dvd-emoji" role="img" aria-label="Evergreen Tree">🌲</span>
        <span class="dvd-emoji" role="img" aria-label="Dashing Away">💨</span>
        <span class="dvd-emoji" role="img" aria-label="Freezing Face">🥶</span>
    </div>

    <div class="emoji-box-footer">
        {{if .IsAuthenticated}}
        <div class="emoji-status">
            <form action="/ride/emoji" method="POST" required>
                <label for="create_or_update_ride_emoji">
                    <emoji-picker>
                        <img class="emoji-picker-icon" src="/static/img/chow-chow-face-icon.png"
                            alt="An outline of a chow chow's face">
                    </emoji-picker>
                </label>
                {{with .Form.FieldErrors.emoji}}
                <label class="error">{{.}}</label>
                {{end}}
                <input type="text" id="create_or_update_ride_emoji" name="emoji" required value="{{.Form.Emoji}}">
            </form>
            <input type="submit" value="Add Emoji">
        </div>
        {{else}}
        <div class="emoji-status">
            <p><a href="/user/login">Log in</a> to add an emoji!</p>
        </div>
        {{end}}
    </div>
</div>
{{end}}
