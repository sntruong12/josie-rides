{{define "base"}}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{{template "title" .}} - Josie Rides</title>
    <!-- Link to the CSS stylesheet and favicon -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/emoji-box.css">
    <link rel="shortcut icon" href="/static/img/favicon.ico" type="image/x-icon">
    <!-- Also link to some fonts hosted by Google -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu+Mono:400,700">
    <script src="/static/js/main.js" type="text/javascript" defer></script>
    <script src="/static/js/emoji-box.js" type="text/javascript" defer></script>
    <!-- Emoji picker -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js" integrity="sha512-..."
        crossorigin="anonymous" defer></script>
</head>

<body>
    <header>
        <h1><a href="/">Josie Rides</a></h1>
    </header>
    {{template "nav" .}}
    <main>
        <!-- Display the flash message if one exists -->
        {{with .Flash}}
        <div class="flash">{{.}}</div>
        {{end}}
        {{template "main" .}}
    </main>
    {{template "footer" .}}
</body>

</html>
{{end}}
