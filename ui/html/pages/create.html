{{define "title"}}Create a new ride{{end}}

{{define "main"}}
<form action="/ride/create" method="POST" required>
    <div>
        <label for="create_ride_title">Title:</label>
        <input type="text" id="create_ride_title" name="title" required>
    </div>
    <div>
        <label for="create_ride_description">Description:</label>
        <textarea id="create_ride_description" name="description" required></textarea>
    </div>
    <div>
        <label for="create_ride_trail_name">Trail Name:</label>
        <input type="text" id="create_ride_trail_name" name="trail_name" required>
    </div>
    <div>
        <label for="create_ride_distance_miles">Distance (Miles):</label>
        <input type="number" id="create_ride_distance_miles" name="distance_miles" min="0" max="99999.99" step="0.01"
            required>
    </div>
    <div>
        <label for="create_ride_duration_hours">Duration:</label>
        <div class="duration-inputs">
            <input type="number" id="create_ride_duration_hours" name="duration_hours" min="0" max="99" step="1"
                placeholder="HH" required>
            <span>:</span>
            <input type="number" id="create_ride_duration_minutes" name="duration_minutes" min="0" max="59" step="1"
                placeholder="MM" required>
            <span>:</span>
            <input type="number" id="create_ride_duration_seconds" name="duration_seconds" min="0" max="59" step="1"
                placeholder="SS" required>
        </div>
    </div>
    <div>
        <label for="create_ride_rode_at">Rode At:</label>
        <input type="datetime-local" id="create_ride_rode_at" name="rode_at" required>
    </div>
    <div>
        <label for="create_ride_timezone">Time Zone:</label>
        <select id="create_ride_timezone" name="timezone" required>
            <option value="UTC">UTC</option>
        </select>
    </div>
    <div>
        <label for="create_ride_media">Media:</label>
        <input type="file" id="create_ride_media" accept="image/*,video/*" name="media" multiple="true">
    </div>
    <div>
        <input type="submit" value="Publish Ride">
    </div>
</form>
{{end}}
