{{define "title"}}View Ride #{{.Ride.ID}}{{end}}

{{define "main"}}
{{with .Ride}}
<div class='ride'>
    <div class='metadata'>
        <strong>{{.Title}}</strong>
        <p>Trail Name: {{.TrailName}}</p>
        <p>Description: {{.Description}}</p>
        <p>Distance (Miles): {{.DistanceMiles}}</p>
        <p>Duration: {{.Duration}} seconds</p>
    </div>
    <pre><code>{{.Media}}</code></pre>
    <div class='metadata'>
        <time>Created: {{.CreatedAt}}</time>
        <time>RodeAt: {{.RodeAt}}</time>
    </div>
</div>
{{end}}
{{end}}
