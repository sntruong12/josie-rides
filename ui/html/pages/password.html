{{define "title"}}Change Password{{end}}
{{define "main"}}
<h2>Change Password</h2>
<form action="/user/password/reset" method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div>
        <label for="reset_current_password">Current password:</label>
        {{with .Form.FieldErrors.currentPassword}}
        <label class="error">{{.}}</label>
        {{end}}
        <input type="password" id="reset_current_password" name="current_password">
    </div>
    <div>
        <label for="reset_new_password">New password:</label>
        {{with .Form.FieldErrors.newPassword}}
        <label class="error">{{.}}</label>
        {{end}}
        <input type="password" id="reset_new_password" name="new_password">
    </div>
    <div>
        <label for="reset_new_password_confirmation">Confirm new password:</label>
        {{with .Form.FieldErrors.newPasswordConfirmation}}
        <label class="error">{{.}}</label>
        {{end}}
        <input type="password" id="reset_new_password_confirmation" name="new_password_confirmation">
    </div>
    <div>
        <input type="submit" value="Change password">
    </div>
</form>
{{end}}
