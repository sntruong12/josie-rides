{{define "title"}}Login{{end}}
{{define "main"}}
<form action='/user/login' method='POST' novalidate>
    <!-- Notice that here we are looping over the NonFieldErrors and displaying
them, if any exist -->
    {{range .Form.NonFieldErrors}}
    <div class='error'>{{.}}</div>
    {{end}}
    <div>
        <label for="user_login_email">Email:</label>
        {{with .Form.FieldErrors.email}}
        <label class='error'>{{.}}</label>
        {{end}}
        <input id="user_login_email" type='email' name='email' value='{{.Form.Email}}'>
    </div>
    <div>
        <label for="user_login_password">Password:</label>
        {{with .Form.FieldErrors.password}}
        <label class='error'>{{.}}</label>
        {{end}}
        <input id="user_login_password" type='password' name='password'>
    </div>
    <div>
        <input type='submit' value='Login'>
    </div>
</form>
{{end}}
